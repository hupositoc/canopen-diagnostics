<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
<title id="title">CANopen Diagnostics workflow</title>
<desc id="description">Make CANopen traffic and heartbeat state readable while checking normal operation of a marine control and monitoring module through a PC-based test setup. Flow: CAN frames; Decode identifiers; Track heartbeat state; Review event evidence</desc>
